# Runyan defaults for 雾凇拼音 (rime_ice). Applied before imported and generated
# layers, so anything here can be overridden from Runyan Settings.
#
# Subscribed online vocabularies are mounted into every enabled schema as
# `runyan_online` by SubscriptionManager.ensureTables() before each deploy.
patch:
  translator/enable_user_dict: true
  translator/enable_encoder: true
  translator/encode_commit_history: true
  translator/enable_sentence: true
